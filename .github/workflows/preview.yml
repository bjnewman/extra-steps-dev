name: Preview Deploy

# pull_request_target runs in the context of the base branch (main),
# so secrets are available. The protected environment below adds a
# manual approval gate for PRs from outside contributors.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      # Check out the PR head (not the base), but only after environment approval
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: extra-steps-dev
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
