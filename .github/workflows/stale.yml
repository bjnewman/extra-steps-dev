name: Stale

on:
  schedule:
    - cron: "0 0 * * 1" # weekly, Monday midnight UTC
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days.
            Leave a comment if you're still interested and we'll keep it open.
          stale-pr-message: >
            This PR has been inactive for 30 days.
            Leave a comment if you're still working on it.
          close-issue-message: "Closing after 14 days post-stale. Feel free to reopen."
          close-pr-message: "Closing after 14 days post-stale. Feel free to reopen."
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: 14
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: pinned
